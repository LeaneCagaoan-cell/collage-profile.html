<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collage Student Profile Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: #f3e5f5;
            padding: 2rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #fffaf0;
            border: 4px solid #ce93d8;
            border-radius: 20px;
            padding: 2.5rem;
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            color: #6a1b9a;
            margin-bottom: 2rem;
        }

        .collage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .profile-card {
            background-color: #ffffff;
            border: 3px solid #ab47bc;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px);
        }

        .profile-card h2 {
            font-size: 1.5rem;
            color: #4a148c;
            margin-bottom: 0.8rem;
        }

        .profile-card p {
            font-size: 1rem;
            color: #333333;
            margin-bottom: 0.5rem;
        }

        .icon {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 1rem;
        }

        .purple {
            border-color: #7b1fa2;
        }

        .blue {
            border-color: #42a5f5;
        }

        .green {
            border-color: #66bb6a;
        }

        .orange {
            border-color: #ffa726;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Collage Student Profile Card</h1>

        <div class="collage-grid">

            <!-- Profile 1 -->
            <div class="profile-card purple">
                <div class="icon">🎓</div>
                <h2>Honey Leane Cagoan</h2>
                <p>Student ID: 12133201</p>
                <p>Program: BSIT</p>
            </div>

            <!-- Profile 2 -->
            <div class="profile-card blue">
                <div class="icon">📘</div>
                <h2>Maria Santos</h2>
                <p>Student ID: 12133202</p>
                <p>Program: BSCS</p>
            </div>

            <!-- Profile 3 -->
            <div class="profile-card green">
                <div class="icon">💻</div>
                <h2>John Reyes</h2>
                <p>Student ID: 12133203</p>
                <p>Program: BSIS</p>
            </div>

            <!-- Profile 4 -->
            <div class="profile-card orange">
                <div class="icon">🎒</div>
                <h2>Beatrice Dizon</h2>
                <p>Student ID: 12133204</p>
                <p>Program: BSIT</p>
            </div>

        </div>

    </div>

</body>
</html>
